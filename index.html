<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CrewHub — Build Your Crew</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* ---- Backgrounds (dark canvas system) ---- */
  --bg-1:#050509;       /* deep black */
  --bg-2:#080B1A;       /* midnight navy */
  --bg-3:#0B1024;       /* dark blue */
  --bg-violet:#12102A;  /* deep violet */
  --ink:#0B1024;        /* primary dark surface (nav, hero, sidebars) */
  --ink-2:#050509;      /* deepest dark (gradient stops) */
  --ink-3:#151B3D;      /* mid dark accent surface */
  --ink-rgb:2,3,10;
  /* ---- Accents ---- */
  --orange:#FF6B35;
  --orange-2:#FF8657;
  --violet:#8B5CF6;
  --violet-2:#A78BFA;
  --blue:#2563EB;
  --blue-2:#4C7EF3;
  --cyan:#22D3EE;
  --cyan-2:#67E4F5;
  --success:#10B981;
  --danger:#EF4444;
  /* ---- Legacy aliases (kept so existing var() calls repaint automatically) ---- */
  --white:#050509;
  --mint:#22D3EE;
  --sky:#2563EB;
  --panel:#11152D;
  --panel-2:#0B0E20;
  /* ---- Text ---- */
  --grey:#A8B0C2;         /* secondary text */
  --grey-soft:#8890A6;
  --grey-line:rgba(255,255,255,.10);
  --grey-line-2:rgba(255,255,255,.07);
  --text-primary:#FFFFFF;
  --text-secondary:#A8B0C2;
  --text-muted:#6B7280;
  --radius-s:10px;
  --radius-m:16px;
  --radius-l:26px;
  --ease: cubic-bezier(.22,1,.36,1);
  --shadow-xs: 0 1px 2px rgba(0,0,0,.35);
  --shadow-sm: 0 2px 10px -2px rgba(0,0,0,.45), 0 1px 2px rgba(0,0,0,.3);
  --shadow-md: 0 18px 40px -16px rgba(0,0,0,.55), 0 4px 16px -6px rgba(0,0,0,.4);
  --shadow-lg: 0 32px 74px -20px rgba(0,0,0,.65), 0 10px 28px -8px rgba(0,0,0,.5);
  --glow-violet: 0 0 0 1px rgba(139,92,246,.4), 0 8px 28px -8px rgba(139,92,246,.45);
  --glow-blue: 0 0 0 1px rgba(37,99,235,.4), 0 8px 28px -8px rgba(37,99,235,.45);
  --glow-cyan: 0 0 0 1px rgba(34,211,238,.35), 0 8px 28px -8px rgba(34,211,238,.4);
  --font-display:'Space Grotesk', 'Inter', sans-serif;
  --font-body:'Inter', sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth; scroll-padding-top:env(safe-area-inset-top,0px); background:var(--bg-1); overflow-x:hidden; max-width:100%;}
body{
  margin:0; font-family:var(--font-body); color:var(--text-primary);
  overflow-x:hidden; max-width:100%;
  background:
    radial-gradient(1000px 560px at 85% -8%, rgba(139,92,246,.10), transparent 60%),
    radial-gradient(900px 520px at 8% 0%, rgba(37,99,235,.08), transparent 55%),
    var(--bg-1);
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  min-height:100%; font-size:15.5px; line-height:1.55;
}
h1,h2,h3,h4{font-family:var(--font-display); margin:0; letter-spacing:-0.02em; line-height:1.06; font-weight:700; color:var(--text-primary);}
h3{letter-spacing:-0.01em;}
p{margin:0}
a{color:inherit; text-decoration:none}
button{font-family:var(--font-body); cursor:pointer;}
img{max-width:100%; display:block;}
::selection{background:var(--violet); color:#fff}
* {scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.18) transparent;}
::-webkit-scrollbar{width:9px; height:9px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14); border-radius:8px; border:2px solid transparent; background-clip:padding-box;}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.26); background-clip:padding-box;}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
}

/* ---------- Layout shell ---------- */
#app{min-height:100%; display:flex; flex-direction:column;}
.topnav{
  position:sticky; top:0; z-index:500;
  display:flex; align-items:center; gap:30px;
  padding:15px 30px; padding-top:calc(15px + env(safe-area-inset-top,0px));
  background:rgba(5,5,9,.78); backdrop-filter:blur(18px) saturate(1.4);
  border-bottom:1px solid rgba(255,255,255,.07);
  color:var(--text-primary);
  transition:background .3s var(--ease), box-shadow .3s var(--ease), border-color .3s var(--ease);
}
.topnav.scrolled{box-shadow:0 12px 34px -18px rgba(0,0,0,.7); border-bottom-color:rgba(139,92,246,.18);}
.brand{display:flex; align-items:center; gap:11px; font-family:var(--font-display); font-weight:700; font-size:18.5px; letter-spacing:-0.02em; cursor:pointer; flex-shrink:0; transition:opacity .2s;}
.brand:hover{opacity:.85;}
.brand-logo{height:36px; width:auto; display:block; flex-shrink:0; filter:drop-shadow(0 0 8px rgba(139,92,246,.4));}
.navlinks{display:flex; align-items:center; gap:2px; flex:1;}
.navlinks a{
  position:relative; padding:9px 15px; border-radius:10px; font-size:14px; font-weight:500;
  color:var(--text-secondary); opacity:1; transition:color .2s var(--ease), background .2s var(--ease);
  white-space:nowrap; display:inline-flex; align-items:center; gap:7px;
}
.navlinks a::before{content:''; width:5px; height:5px; border-radius:50%; background:var(--violet); opacity:0; transform:scale(.4); transition:all .2s var(--ease); box-shadow:0 0 8px rgba(139,92,246,.9);}
.navlinks a:hover{color:#fff; background:rgba(255,255,255,.06)}
.navlinks a.active{color:#fff; font-weight:600; background:rgba(139,92,246,.12);}
.navlinks a.active::before{opacity:1; transform:scale(1);}
.nav-right{display:flex; align-items:center; gap:11px; flex-shrink:0;}
.btn{
  border:none; border-radius:999px; padding:10px 19px; font-weight:600; font-size:14px;
  display:inline-flex; align-items:center; gap:8px; transition:transform .18s var(--ease), box-shadow .18s var(--ease), background .18s var(--ease), opacity .18s;
  white-space:nowrap; letter-spacing:-0.005em;
}
.btn:active{transform:translateY(0) scale(.97)}
.btn-primary{background:linear-gradient(178deg, var(--orange-2), var(--orange)); color:#fff; box-shadow:0 1px 0 rgba(255,255,255,.22) inset, 0 8px 22px -9px rgba(255,107,53,.65);}
.btn-primary:hover{transform:translateY(-1px); box-shadow:0 1px 0 rgba(255,255,255,.25) inset, 0 14px 30px -10px rgba(255,107,53,.75);}
.btn-violet{background:linear-gradient(178deg, var(--violet-2), var(--violet)); color:#fff; box-shadow:0 1px 0 rgba(255,255,255,.2) inset, 0 8px 22px -9px rgba(139,92,246,.6);}
.btn-violet:hover{transform:translateY(-1px); box-shadow:0 1px 0 rgba(255,255,255,.24) inset, 0 14px 30px -10px rgba(139,92,246,.7);}
.btn-blue{background:linear-gradient(178deg, var(--blue-2), var(--blue)); color:#fff; box-shadow:0 1px 0 rgba(255,255,255,.2) inset, 0 8px 22px -9px rgba(37,99,235,.6);}
.btn-blue:hover{transform:translateY(-1px); box-shadow:0 1px 0 rgba(255,255,255,.24) inset, 0 14px 30px -10px rgba(37,99,235,.7);}
.btn-ghost{background:rgba(139,92,246,.06); color:var(--text-primary); border:1px solid rgba(139,92,246,.35); transition:all .18s var(--ease);}
.btn-ghost:hover{background:rgba(139,92,246,.14); border-color:rgba(139,92,246,.6); box-shadow:0 0 20px -6px rgba(139,92,246,.5); transform:translateY(-1px);}
.btn-outline-dark{background:transparent; color:var(--text-primary); border:1.5px solid rgba(255,255,255,.28);}
.btn-outline-dark:hover{background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.5); transform:translateY(-1px);}
.btn-sm{padding:7.5px 14px; font-size:13px; border-radius:999px;}
.btn-icon{width:38px; height:38px; border-radius:50%; padding:0; display:inline-flex; align-items:center; justify-content:center; background:rgba(255,255,255,.06); color:var(--text-primary); border:none; transition:background .2s var(--ease), transform .2s var(--ease);}
.btn-icon:hover{transform:translateY(-1px); background:rgba(255,255,255,.12);}
.avatar{
  width:36px; height:36px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:600; font-size:12.5px; color:#fff; letter-spacing:0;
  background:linear-gradient(135deg, var(--violet), var(--orange));
  box-shadow:0 0 0 2px rgba(255,255,255,.14);
}
.hamburger{display:none; background:none; border:none; color:inherit; padding:8px;}
.hamburger svg{width:24px;height:24px;}

/* mobile drawer */
.mobile-drawer{position:fixed; inset:0; z-index:900; display:none;}
.mobile-drawer.open{display:block;}
.mobile-drawer .scrim{position:absolute; inset:0; background:rgba(2,2,6,.7); backdrop-filter:blur(2px);}
.mobile-drawer .panel{
  position:absolute; top:0; right:0; height:100%; width:78%; max-width:320px;
  background:var(--bg-2); color:var(--text-primary); padding:24px 20px; padding-top:calc(24px + env(safe-area-inset-top,0px));
  display:flex; flex-direction:column; gap:2px; border-left:1px solid rgba(255,255,255,.08);
  animation:slideIn .3s var(--ease); box-shadow:var(--shadow-lg);
}
@keyframes slideIn{from{transform:translateX(100%)} to{transform:translateX(0)}}
.mobile-drawer a{padding:14px 8px; border-bottom:1px solid rgba(255,255,255,.07); font-weight:500; font-size:14.5px; color:var(--text-secondary); transition:padding-left .2s var(--ease), color .2s;}
.mobile-drawer a:hover{padding-left:14px; color:var(--orange);}

main{flex:1; width:100%;}
.view{display:none;}
.view.active{display:block; animation:fadeIn .35s var(--ease);}
@keyframes fadeIn{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}

.wrap{max-width:1240px; margin:0 auto; padding:0 30px;}
@media (max-width:720px){ .wrap{padding:0 20px;} }

/* ---------- Chips / segmented filters ---------- */
.chip{
  border:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.04); border-radius:999px; padding:8.5px 16px;
  font-size:13.5px; font-weight:500; color:var(--text-secondary); display:inline-flex; align-items:center; gap:6px;
  transition:all .18s var(--ease);
}
.chip:hover{border-color:rgba(255,255,255,.3); background:rgba(255,255,255,.08); color:#fff; transform:translateY(-1px);}
.chip.active{background:linear-gradient(178deg, var(--violet-2), var(--violet)); color:#fff; border-color:transparent; box-shadow:var(--glow-violet); transform:translateY(-1px);}

/* ---------- Cards ---------- */
.card{
  background:var(--panel); border:1px solid rgba(255,255,255,.08); border-radius:var(--radius-m);
  box-shadow:var(--shadow-sm);
  transition:transform .28s var(--ease), box-shadow .28s var(--ease), border-color .28s var(--ease);
}
.card:hover{ transform:translateY(-3px); box-shadow:var(--shadow-md); border-color:rgba(139,92,246,.28); }
.glass{
  background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(14px);
}

/* ---------- Entrance animation (single orchestrated hero moment) ---------- */
@keyframes riseIn{ from{opacity:0; transform:translateY(18px);} to{opacity:1; transform:translateY(0);} }
.rise{opacity:0; animation:riseIn .8s var(--ease) forwards;}
.rise.d1{animation-delay:.04s} .rise.d2{animation-delay:.14s} .rise.d3{animation-delay:.24s} .rise.d4{animation-delay:.34s} .rise.d5{animation-delay:.44s}

/* ---------- Toasts ---------- */
#toasts{position:fixed; bottom:24px; right:24px; z-index:2000; display:flex; flex-direction:column; gap:10px; align-items:flex-end;}
.toast{
  background:var(--bg-2); color:#fff; padding:14px 19px; border-radius:13px; font-size:13.5px; font-weight:500;
  box-shadow:var(--shadow-lg), 0 0 0 1px rgba(255,255,255,.08); display:flex; align-items:center; gap:10px; max-width:320px;
  animation:toastIn .3s var(--ease);
}
.toast .dot{width:8px; height:8px; border-radius:50%; background:var(--cyan); flex-shrink:0; box-shadow:0 0 0 3px rgba(34,211,238,.22);}
@keyframes toastIn{from{opacity:0; transform:translateY(12px) scale(.94)} to{opacity:1; transform:none}}

/* ---------- Modal ---------- */
.modal-scrim{position:fixed; inset:0; background:rgba(2,2,6,.72); backdrop-filter:blur(4px); z-index:1500; display:none; align-items:center; justify-content:center; padding:20px;}
.modal-scrim.open{display:flex;}
.modal{
  background:var(--bg-2); border:1px solid rgba(255,255,255,.09); border-radius:var(--radius-l); max-width:520px; width:100%; max-height:88vh; overflow:auto;
  padding:30px; position:relative; animation:modalIn .28s var(--ease); box-shadow:var(--shadow-lg);
  color:var(--text-primary);
}
@keyframes modalIn{from{opacity:0; transform:translateY(16px) scale(.97)} to{opacity:1; transform:none}}
.modal-close{position:absolute; top:18px; right:18px; background:rgba(255,255,255,.06); border:none; width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--text-primary); transition:background .2s, transform .2s;}
.modal-close:hover{background:rgba(255,255,255,.14); transform:rotate(90deg);}
.field{display:flex; flex-direction:column; gap:6px; margin-bottom:16px;}
.field label{font-size:12.5px; font-weight:600; color:var(--text-secondary); text-transform:none;}
.field input, .field textarea, .field select{
  border:1.5px solid rgba(255,255,255,.14); border-radius:10px; padding:11px 13px; font-family:inherit; font-size:14.5px; color:var(--text-primary); background:rgba(255,255,255,.04); transition:border-color .18s;
}
.field input::placeholder, .field textarea::placeholder{color:var(--text-muted);}
.field input:focus, .field textarea:focus, .field select:focus{outline:none; border-color:var(--violet); box-shadow:0 0 0 3px rgba(139,92,246,.18);}
.field select option{background:var(--bg-2); color:#fff;}

/* focus visibility */
a:focus-visible, button:focus-visible, input:focus-visible, [tabindex]:focus-visible{outline:2px solid var(--violet); outline-offset:2px; border-radius:4px;}

/* Section heading pattern */
.section-head{margin-bottom:40px;}
.section-head h2{font-size:clamp(28px,3.6vw,40px);}
.section-head p{color:var(--text-secondary); font-size:16px; margin-top:10px; max-width:560px; line-height:1.6;}
.section-pad{padding:76px 0;}
@media (max-width:720px){.section-pad{padding:52px 0;}}

/* ============================================================
   CREATIVE WORKSPACE — full-screen production environment
   ============================================================ */
.ws-overlay{
  position:fixed; inset:0; z-index:1200; display:none; flex-direction:column;
  background:var(--bg-1); color:#EDF0FA; font-size:14px;
}
.ws-overlay.open{display:flex;}
.ws-header{
  height:60px; flex-shrink:0; display:flex; align-items:center; gap:16px; padding:0 18px;
  background:var(--bg-2); border-bottom:1px solid rgba(255,255,255,.08);
}
.ws-back{width:36px; height:36px; border-radius:9px; background:rgba(255,255,255,.06); border:none; color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:background .18s;}
.ws-back:hover{background:rgba(255,255,255,.13);}
.ws-crumb{font-size:12px; color:var(--text-muted); white-space:nowrap;}
.ws-title-block{display:flex; align-items:center; gap:10px; min-width:0;}
.ws-title{font-family:var(--font-display); font-weight:700; font-size:15.5px; letter-spacing:-0.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.ws-status-pill{font-size:11px; font-weight:600; padding:3px 10px; border-radius:999px; background:rgba(139,92,246,.18); color:var(--violet-2); white-space:nowrap; border:1px solid rgba(139,92,246,.3);}
.ws-meta{font-size:11.5px; color:var(--text-muted); white-space:nowrap; display:none;}
@media(min-width:860px){.ws-meta{display:inline;}}
.ws-body{flex:1; display:flex; min-height:0;}
.ws-rail{
  width:64px; flex-shrink:0; background:var(--bg-2); border-right:1px solid rgba(255,255,255,.07);
  display:flex; flex-direction:column; align-items:center; padding:14px 0; gap:4px;
}
.ws-rail-btn{
  width:44px; height:44px; border-radius:12px; background:transparent; border:none; color:var(--text-muted);
  display:flex; align-items:center; justify-content:center; flex-direction:column; gap:2px; transition:all .18s var(--ease); position:relative;
}
.ws-rail-btn svg{width:19px; height:19px;}
.ws-rail-btn span{font-size:8.5px; font-weight:600; letter-spacing:.01em;}
.ws-rail-btn:hover{background:rgba(255,255,255,.06); color:#fff;}
.ws-rail-btn.active{background:rgba(139,92,246,.16); color:var(--violet-2);}
.ws-rail-btn.active::before{content:''; position:absolute; left:-14px; top:50%; transform:translateY(-50%); width:3px; height:20px; background:var(--violet); border-radius:0 3px 3px 0; box-shadow:0 0 8px rgba(139,92,246,.8);}
.ws-center{flex:1; min-width:0; display:flex; flex-direction:column; background:var(--bg-1);}
.ws-preview{
  flex:1; min-height:0; position:relative; display:flex; align-items:center; justify-content:center;
  background:radial-gradient(circle at 50% 38%, #1B1440 0%, var(--bg-1) 72%);
  border-bottom:1px solid rgba(255,255,255,.06);
}
.ws-preview-grid{position:absolute; inset:0; background-image:radial-gradient(rgba(255,255,255,.035) 1px, transparent 1px); background-size:24px 24px;}
.ws-preview-tag{position:absolute; font-size:10.5px; font-weight:600; padding:5px 10px; border-radius:7px; background:rgba(0,0,0,.4); backdrop-filter:blur(4px); color:#fff; letter-spacing:.02em; border:1px solid rgba(255,255,255,.08);}
.ws-transport{
  height:52px; flex-shrink:0; display:flex; align-items:center; gap:14px; padding:0 18px;
  background:var(--bg-2); border-bottom:1px solid rgba(255,255,255,.07);
}
.ws-tbtn{width:32px; height:32px; border-radius:8px; background:rgba(255,255,255,.06); border:none; color:#fff; display:flex; align-items:center; justify-content:center; transition:background .15s;}
.ws-tbtn:hover{background:rgba(255,255,255,.14);}
.ws-tbtn.play{width:38px; height:38px; background:var(--orange); box-shadow:0 0 0 4px rgba(255,107,53,.18);}
.ws-tbtn.play:hover{background:var(--orange-2);}
.ws-timecode{font-family:var(--font-display); font-size:13px; font-weight:600; letter-spacing:.02em; color:#fff; white-space:nowrap; font-variant-numeric:tabular-nums;}
.ws-timeline-wrap{
  height:236px; flex-shrink:0; display:flex; background:var(--bg-2);
}
.ws-track-labels{
  width:132px; flex-shrink:0; border-right:1px solid rgba(255,255,255,.07); background:var(--bg-1);
}
.ws-track-label{
  height:52px; display:flex; align-items:center; gap:8px; padding:0 12px; border-bottom:1px solid rgba(255,255,255,.05); font-size:11.5px; font-weight:600; color:var(--text-secondary);
}
.ws-track-label svg{width:13px; height:13px; flex-shrink:0; opacity:.8;}
.ws-tracks-scroll{flex:1; overflow-x:auto; overflow-y:hidden; position:relative;}
.ws-tracks-inner{position:relative; height:100%;}
.ws-track-row{height:52px; border-bottom:1px solid rgba(255,255,255,.05); position:relative;}
.ws-clip{
  position:absolute; top:6px; bottom:6px; border-radius:7px; padding:0 10px; display:flex; align-items:center;
  font-size:11px; font-weight:600; color:#050509; white-space:nowrap; overflow:hidden; cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,.4); transition:filter .15s, transform .15s, box-shadow .15s; border:1px solid rgba(255,255,255,.22);
}
.ws-clip:hover{filter:brightness(1.14); transform:translateY(-1px); box-shadow:0 4px 14px rgba(0,0,0,.5);}
.ws-playhead{position:absolute; top:0; bottom:0; width:2px; background:var(--orange); z-index:5; box-shadow:0 0 10px rgba(255,107,53,.85); pointer-events:none;}
.ws-playhead::before{content:''; position:absolute; top:-1px; left:50%; transform:translateX(-50%); width:11px; height:11px; background:var(--orange); border-radius:3px 3px 6px 6px; box-shadow:0 0 8px rgba(255,107,53,.7);}
.ws-ruler{height:20px; background:var(--bg-1); position:relative; border-bottom:1px solid rgba(255,255,255,.07);}
.ws-panel{
  width:340px; flex-shrink:0; background:var(--bg-2); border-left:1px solid rgba(255,255,255,.08);
  display:flex; flex-direction:column; min-height:0;
}
.ws-panel-head{padding:16px 18px 12px; border-bottom:1px solid rgba(255,255,255,.07); flex-shrink:0;}
.ws-panel-title{font-family:var(--font-display); font-weight:700; font-size:14.5px;}
.ws-panel-sub{font-size:11.5px; color:var(--text-muted); margin-top:3px;}
.ws-panel-body{flex:1; overflow-y:auto; padding:8px 0;}
.ws-row{padding:12px 18px; border-bottom:1px solid rgba(255,255,255,.05); transition:background .15s;}
.ws-row:hover{background:rgba(255,255,255,.03);}
.ws-comment-time{font-family:var(--font-display); font-size:11px; font-weight:700; color:var(--blue-2); cursor:pointer; flex-shrink:0;}
.ws-taskcheck{width:16px; height:16px; accent-color:var(--orange); flex-shrink:0;}
.ws-priority{font-size:9.5px; font-weight:700; padding:2px 7px; border-radius:5px; letter-spacing:.02em;}
.ws-mini-avatar{width:26px; height:26px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:600; font-size:10px; color:#fff; background:linear-gradient(135deg,var(--violet),var(--orange));}
.ws-online-dot{width:8px; height:8px; border-radius:50%; border:2px solid var(--bg-2); position:absolute; bottom:-1px; right:-1px; background:var(--success);}
@media(max-width:980px){ .ws-panel{position:absolute; right:0; top:0; bottom:0; box-shadow:-12px 0 30px rgba(0,0,0,.5);} .ws-rail{width:56px;} .ws-track-labels{width:100px;} }

/* ============================================================
   HERO — premium typography + hero logo display
   ============================================================ */
.hero-emph-orange{color:var(--orange); text-shadow:0 0 26px rgba(255,107,53,.45);}
.hero-emph-gradient{background:linear-gradient(90deg, var(--violet-2), var(--blue-2)); -webkit-background-clip:text; background-clip:text; color:transparent;}
.hero-emph-glow{color:#fff; text-shadow:0 0 22px rgba(139,92,246,.55);}
.hero-logo-stage{position:relative; min-height:560px; display:flex; align-items:center; justify-content:center;}
.hero-logo-glow{position:absolute; inset:-12% -8%; pointer-events:none;}
.hero-logo-glow span{position:absolute; border-radius:50%; will-change:opacity, transform;}
.hero-logo-glow .g1{left:8%; top:6%; width:74%; height:74%; background:radial-gradient(closest-side, rgba(139,92,246,.42), rgba(139,92,246,.14) 55%, transparent 100%); animation:heroGlowA 11s ease-in-out infinite;}
.hero-logo-glow .g2{right:0; top:22%; width:66%; height:66%; background:radial-gradient(closest-side, rgba(37,99,235,.36), rgba(37,99,235,.10) 58%, transparent 100%); animation:heroGlowB 13s ease-in-out infinite;}
.hero-logo-glow .g3{left:24%; bottom:2%; width:54%; height:46%; background:radial-gradient(closest-side, rgba(34,211,238,.20), transparent 100%); animation:heroGlowA 15s ease-in-out infinite reverse;}
.hero-logo-glow .g4{left:38%; top:4%; width:44%; height:38%; background:radial-gradient(closest-side, rgba(255,107,53,.18), transparent 100%); animation:heroGlowB 12s ease-in-out infinite;}
@keyframes heroGlowA{0%,100%{opacity:.75; transform:translate(0,0) scale(1);} 50%{opacity:1; transform:translate(2%,-2%) scale(1.06);}}
@keyframes heroGlowB{0%,100%{opacity:.7; transform:translate(0,0) scale(1.03);} 50%{opacity:1; transform:translate(-2%,2%) scale(.98);}}
.hero-logo-wrap{position:relative; width:100%; max-width:600px; animation:heroFloat 8s ease-in-out infinite;}
.hero-logo-img{display:block; width:100%; height:auto; border:0; border-radius:0; background:none; box-shadow:none; user-select:none; -webkit-user-drag:none; filter:drop-shadow(0 18px 46px rgba(139,92,246,.28));}
@keyframes heroFloat{0%,100%{transform:translateY(0);} 50%{transform:translateY(-10px);}}
.hero-particle{position:absolute; border-radius:50%; background:var(--cyan); opacity:.5; animation:heroParticle 7s ease-in-out infinite;}
@keyframes heroParticle{0%,100%{transform:translateY(0); opacity:.15;} 50%{transform:translateY(-14px); opacity:.65;}}
@media(max-width:900px){
  .hero-grid{grid-template-columns:1fr !important; gap:36px !important;}
  .hero-logo-stage{min-height:0; padding:12px 0 8px; overflow:hidden;}
  .hero-logo-wrap{max-width:min(440px, 92%); margin:0 auto;}
}
@media(prefers-reduced-motion:reduce){ .hero-logo-wrap,.hero-logo-glow span,.hero-particle{animation:none !important;} }

/* ---------- Responsive: navigation + landing ---------- */
@media(max-width:1080px){
  .navlinks{display:none;}
  .hamburger{display:inline-flex; margin-left:2px;}
  .topnav{gap:14px; justify-content:space-between;}
  .nav-right{margin-left:auto;}
}
@media(max-width:600px){
  .topnav{padding-left:14px; padding-right:14px; gap:10px;}
  .nav-right{gap:8px;}
  .nav-right .btn-primary{padding:8px 13px; font-size:13px;}
  .brand{font-size:17px; gap:9px;}
  .brand-logo{height:27px;}
}
@media(max-width:860px){
  .before-after-grid{grid-template-columns:minmax(0,1fr) !important; gap:32px !important;}
  .ba-cards{grid-template-columns:minmax(0,1fr) !important;}
  .workflow-grid{grid-template-columns:repeat(2,minmax(0,1fr)) !important;}
}
@media(max-width:480px){
  .workflow-grid{grid-template-columns:minmax(0,1fr) !important;}
}

/* ---------- Workspace on small screens: stack rail / editor / panel ---------- */
@media(max-width:860px){
  .ws-header{padding:0 12px; gap:10px;}
  .ws-body{flex-direction:column; overflow-y:auto; overflow-x:hidden;}
  .ws-rail{width:100%; height:60px; flex-shrink:0; flex-direction:row; justify-content:flex-start; gap:4px; padding:8px 10px; overflow-x:auto; overflow-y:hidden; border-right:0; border-bottom:1px solid rgba(255,255,255,.06);}
  .ws-rail-btn{flex-shrink:0;}
  .ws-rail-btn.active::before{display:none;}
  .ws-center{flex:none; min-height:0;}
  .ws-preview{flex:none; height:min(56vw, 260px);}
  .ws-transport{padding:0 12px; gap:10px;}
  .ws-timeline-wrap{height:236px;}
  .ws-panel{position:static; width:100%; flex:none; min-height:380px; border-left:0; border-top:1px solid rgba(255,255,255,.07); box-shadow:none;}
  .ws-panel-body{overflow:visible;}
}
</style>
</head>

  <section class="section-pad" style="background:var(--white);">
    <div class="wrap">
      <div class="section-head" style="text-align:center; margin:0 auto 48px;">
        <h2>One workflow, five connected stages.</h2>
        <p style="margin:12px auto 0;">Every project moves through the same cycle — no more switching tools to get from idea to audience.</p>
      </div>
      <div style="display:grid; grid-template-columns:repeat(5,1fr); gap:16px;" id="workflowCards" class="workflow-grid"></div>
    </div>
  </section>

  <section class="section-pad" style="background:var(--panel-2);">
    <div class="wrap before-after-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:64px; align-items:center;">
      <div>
        <h2 style="font-size:clamp(26px,3vw,34px);">Why CrewHub?</h2>
        <p style="color:var(--grey); margin-top:16px; line-height:1.65; font-size:15.5px; max-width:440px;">Modern creators piece together an editor, a file drive, a rights checker, a publishing tool and a community platform — five logins for one piece of content. CrewHub treats content as a collaborative project from the first cut to the last comment.</p>
        <button class="btn btn-outline-dark" style="margin-top:26px;" data-nav="workspace">Open Your Workspace</button>
      </div>
      <div class="ba-cards" style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
        <div class="card" style="padding:24px;">
          <div style="font-size:12px; font-weight:600; color:var(--grey);">Before CrewHub</div>
          <div style="margin-top:14px; display:flex; flex-direction:column; gap:11px; font-size:13.5px; color:var(--text-primary);">
            <span style="display:flex; align-items:center; gap:9px;"><span style="opacity:.5;">✂️</span> Editing tool</span>
            <span style="display:flex; align-items:center; gap:9px;"><span style="opacity:.5;">🗂️</span> File storage</span>
            <span style="display:flex; align-items:center; gap:9px;"><span style="opacity:.5;">⚖️</span> Rights checker</span>
            <span style="display:flex; align-items:center; gap:9px;"><span style="opacity:.5;">📤</span> Publishing tool</span>
            <span style="display:flex; align-items:center; gap:9px;"><span style="opacity:.5;">💬</span> Community app</span>
          </div>
        </div>
        <div class="card" style="padding:24px; border:1.5px solid var(--orange); background:linear-gradient(165deg, rgba(255,107,53,.12), rgba(139,92,246,.08));">
          <div style="font-size:12px; font-weight:600; color:var(--orange);">After CrewHub</div>
          <div style="margin-top:14px; font-size:14.5px; line-height:1.65;">One connected creative ecosystem — create, collaborate, protect, publish and connect without leaving the crew.</div>
        </div>
      </div>
    </div>
  </section>

  <section class="section-pad" style="position:relative; overflow:hidden; background:radial-gradient(900px 460px at 50% 0%, rgba(139,92,246,.22), transparent 65%), linear-gradient(180deg, var(--ink-2), var(--ink)); text-align:center;">

// Fill in the "current" snapshot for every version marked current, and give every clip a stable id.
let CLIP_ID_SEQ = 1;
function assignClipIds(tracks){ tracks.forEach(t=> t.clips.forEach(c=>{ if(!c.id) c.id = 'c'+(CLIP_ID_SEQ++); })); }
Object.values(PROJECTS_WS).forEach(p=>{
  assignClipIds(p.tracks);
  const cur = p.versions.find(v=>v.state==='current');
  if(cur && !cur.tracksSnapshot) cur.tracksSnapshot = deepClone(p.tracks);
  p.totalDuration = Math.max(60, ...p.tracks.flatMap(t=>t.clips.map(c=>c.start+c.dur)));
});
function recomputeDuration(p){ p.totalDuration = Math.max(60, ...p.tracks.flatMap(t=>t.clips.map(c=>c.start+c.dur))); }

function wsTogglePlay(){
  wsPlaying = !wsPlaying;

function wsSeekTo(sec){
  wsCurrentTime = Math.max(0, Math.min(WSP().totalDuration, sec));
  wsUpdateTimeUI();
}
function wsAddAssetToTimeline(assetId){
  const asset = ASSET_LIBRARY.find(a=>a.id===assetId);
  if(!asset) return;
  const trackLabel = TRACK_FOR_CAT[asset.cat];
  if(!trackLabel){ toast("This asset type can't be added to the timeline."); return; }
  let track = WSP().tracks.find(t=>t.label===trackLabel);
  if(!track){ track = {label:trackLabel, icon: asset.cat==="Music"?"wave":asset.cat==="Audio"?"mic":"film", color:"var(--blue-2)", clips:[]}; WSP().tracks.push(track); }
  const end = track.clips.length? Math.max(...track.clips.map(c=>c.start+c.dur)) : 0;
  track.clips.push({id:'c'+(CLIP_ID_SEQ++), name:asset.name, start:end, dur:asset.dur||6});
  recomputeDuration(WSP());
  pushActivity("Alex Mehta", "added an asset to", WSP().name);
  pushNotification(`"${asset.name}" added to ${WSP().name}`, "🎬");
  toast(`Added "${asset.name}" to the timeline.`);
  renderWsOverlay();
}
function wsBindTimelineClicks(){
  const inner = $('#wsTracksInner');
  if(!inner) return;
  inner.addEventListener('click', function(e){
    if(e.target.closest('.ws-clip')) return; // clip click handled separately (no-op / could open detail)
    const rect = inner.getBoundingClientRect();
    const x = e.clientX - rect.left;
    wsSeekTo(x / WS_PX_PER_SEC);
  });
}

function runRightsScan(){
  const body = $('#rgBody');
  body.innerHTML = `<div style="text-align:center; padding:34px 0;">
    <div style="position:relative; width:96px; height:96px; margin:0 auto 22px;">
      <svg width="96" height="96" viewBox="0 0 96 96" style="transform:rotate(-90deg);">
        <circle cx="48" cy="48" r="42" fill="none" stroke="var(--grey-line)" stroke-width="6"/>
        <circle id="scanRing" cx="48" cy="48" r="42" fill="none" stroke="var(--cyan)" stroke-width="6" stroke-linecap="round" stroke-dasharray="264" stroke-dashoffset="264" style="transition:stroke-dashoffset .6s var(--ease); filter:drop-shadow(0 0 6px rgba(34,211,238,.6));"/>
      </svg>
      <div id="scanPct" style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:18px;">0%</div>
    </div>
    <div style="font-weight:600; font-size:14.5px;" id="scanStatusText">Scanning original footage…</div>
    <div style="font-size:12.5px; color:var(--grey); margin-top:6px;">This usually takes a few seconds.</div>
  </div>`;
  const msgs = ["Scanning original footage…","Checking audio tracks…","Comparing against rights database…","Checking images and stock assets…","Finalizing report…"];
  let i=0;
  const ring = ()=>$('#scanRing'), pct = ()=>$('#scanPct');
  const iv = setInterval(()=>{
    i++;
    const p = Math.round((i/msgs.length)*100);
    if(ring()) ring().style.strokeDashoffset = String(264 - (264*p/100));
    if(pct()) pct().textContent = p+"%";
    if(i<msgs.length){ $('#scanStatusText').textContent = msgs[i]; }
    else { clearInterval(iv); setTimeout(showRightsResults, 250); }
  }, 650);
}
function showRightsResults(){
  const issues = DATA.rightsResults.filter(r=>!r.ok).length;
  $('#rgBody').innerHTML = `

  return `<div class="wrap" style="padding:40px 28px 80px;">
    <div class="section-head"><h2>Memberships</h2><p>Support creators directly and unlock exclusive perks.</p></div>
    ${membershipsBodyHtml(false)}
  </div>`;
}
function membershipsBodyHtml(compact){
  return `<div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:18px;">
    ${PLANS.map(p=>`<div class="card" style="padding:22px; border-top:3px solid ${p.color};">
      <div style="font-family:var(--font-display); font-weight:700; font-size:17px;">${p.name}</div>
      <div style="font-size:22px; font-weight:700; margin-top:8px;">${p.price}</div>
      <div style="font-size:12px; color:var(--grey); margin-top:4px;">${p.members}</div>
      <ul style="margin:16px 0 0; padding-left:18px; font-size:13px; line-height:1.9; color:var(--text-primary);">${p.perks.map(x=>`<li>${x}</li>`).join('')}</ul>
      <button class="btn btn-primary btn-sm" style="width:100%; margin-top:16px;" data-selectplan="${p.name}">Manage Memberships</button>
    </div>`).join('')}
  </div>`;
}

/* ---------- MARKETPLACE ---------- */
const MP_TABS = ["Assets","Music","Sound Effects","Stock Footage","Templates","Services"];
function renderMarketplace(){
  return `<div class="wrap" style="padding:40px 28px 80px;">
    <div class="section-head"><h2>Creative Marketplace</h2><p>License assets and services from other creators — every listing is pre-checked by RightsGuard.</p></div>
    <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:24px;">
      ${MP_TABS.map(t=>`<button class="chip ${STATE.mpTab===t?'active':''}" data-mptab="${t}">${t}</button>`).join('')}
    </div>
    <div style="display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:16px;" id="mpGrid"></div>
  </div>`;
}
function mpGridHtml(){
  return DATA.marketplace[STATE.mpTab].map(item=>`
    <div class="card" style="overflow:hidden;">
      <div style="height:108px; background:linear-gradient(135deg,var(--violet),var(--sky)); position:relative; display:flex; align-items:center; justify-content:center; color:#fff; font-family:var(--font-display); font-weight:700; font-size:13px; text-align:center; padding:0 14px;">
        <div style="position:absolute; inset:0; background-image:radial-gradient(rgba(255,255,255,.14) 1px, transparent 1px); background-size:14px 14px;"></div>
        <span style="position:relative;">${item.name}</span>
      </div>
      <div style="padding:16px;">
        <div style="font-weight:600; font-size:13.5px;">${item.name}</div>
        <div style="font-size:11.5px; color:var(--grey); margin-top:5px;">by ${item.creator} · ${item.license}</div>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:14px; padding-top:14px; border-top:1px solid var(--grey-line-2);">
          <span style="font-weight:700; font-size:14.5px;">${item.price}</span>
          <div style="display:flex; gap:6px;"><button class="btn btn-outline-dark btn-sm" data-viewasset="${item.name}">View</button><button class="btn btn-primary btn-sm" data-licenseasset="${item.name}">License</button></div>
        </div>
      </div>
    </div>`).join('');
}

/* ---------- BRAND STORY ---------- */
/* ============================================================
   ROUTER
   ============================================================ */
const RENDERERS = {
  landing: renderLanding, dashboard: renderDashboard,
  crew: renderCrew, rightsguard: renderRightsguard, community: renderCommunity,
  live: renderLive, events: renderEvents, profile: renderProfile,
  memberships: renderMemberships, marketplace: renderMarketplace
};

function navigateTo(view){
  if(view === 'workspace'){ openWorkspace(); return; }
  STATE.view = view;
  $('#main').innerHTML = RENDERERS[view]();
  updateNavTheme(); updateActiveLinks();
  window.scrollTo({top:0, behavior:'instant' in window ? 'instant':'auto'});
  postRenderHook(view);
  closeDrawer();
}

function postRenderHook(view){
  if(view==="landing"){ renderWorkflowCards(); animateCounters(); }
  if(view==="crew"){ refreshCrewGrid(); }
  if(view==="community"){ $('#communityBody').innerHTML = communityBodyHtml(); }
  if(view==="live"){ renderLiveChat(); startLiveSimulation(); }
  if(view==="marketplace"){ $('#mpGrid').innerHTML = mpGridHtml(); }
  if(view==="profile"){ $('#profileBody').innerHTML = profileBodyHtml(); }
}

function animateCounters(){
  $all('[data-counter]').forEach(el=>{
    const target = parseInt(el.dataset.counter,10);
    let cur=0; const step = Math.max(1, Math.round(target/40));
    const iv = setInterval(()=>{ cur += step; if(cur>=target){cur=target; clearInterval(iv);} el.textContent = cur.toLocaleString('en-IN'); },20);
  });
}

let liveInterval=null;
function startLiveSimulation(){
  clearInterval(liveInterval);
  const extra = ["🔥🔥🔥","Following now!","This is so smooth","Wait the timeline view is clean","Subscribed to the crew"];
  const names = ["priya_c","dev.edits","filmwithkaran","streetstoriesfan","new_viewer22"];
  liveInterval = setInterval(()=>{
    if(STATE.view!=="live"){ clearInterval(liveInterval); return; }
    const msg = extra[Math.floor(Math.random()*extra.length)];
    liveChatMsgs.push(msg);
    if(liveChatMsgs.length>30) liveChatMsgs.shift();
    renderLiveChat();
    const vc = $('#viewerCount');
    if(vc){ const n = 1204 + Math.floor(Math.random()*40); vc.textContent = n.toLocaleString('en-IN')+" watching"; }
  }, 3400);
}

function closeDrawer(){ $('#mobileDrawer').classList.remove('open'); }

/* ============================================================
   PRESENTATION MODE
   ============================================================ */
const PRESENT_STEPS = [
  {view:"landing", text:"The idea starts here — CrewHub replaces five disconnected tools with one crew."},
  {view:"dashboard", text:"Alex opens the dashboard and starts a new project."},
  {view:"workspace", text:"The Creative Workspace is where the crew edits, comments and versions together."},
  {view:"crew", text:"Find Your Crew brings in the right editor, designer and manager."},
  {view:"rightsguard", text:"Before publishing, RightsGuard scans for licensing issues."},
  {view:"workspace", text:"The team resolves the issue and hits Publish."},
  {view:"community", text:"The audience discovers the project and joins the community."},
  {view:"live", text:"The creator hosts a live session with that new community."},
  {view:"events", text:"The community gathers again at an event — and the cycle starts over."},
];
function enterPresentMode(){
  STATE.present = true; STATE.presentStep = 0;
  $('#presentBar').style.display='flex';
  $('#presentBtn').style.display='none';
  applyPresentStep();
}
function exitPresentMode(){
  STATE.present = false;
  $('#presentBar').style.display='none';
  $('#presentBtn').style.display='flex';
}
function applyPresentStep(){
  const s = PRESENT_STEPS[STATE.presentStep];
  if(s.view === 'workspace'){ closeWorkspace(); navigateTo('dashboard'); openWorkspace(); }
  else { closeWorkspace(); navigateTo(s.view); }
  $('#presentStepLabel').textContent = `Step ${STATE.presentStep+1}/${PRESENT_STEPS.length}`;
  $('#presentStepText').textContent = s.text;
}

/* ============================================================
   EVENT WIRING
   ============================================================ */
document.addEventListener('click', function(e){
  const navEl = e.target.closest('[data-nav]');
  if(navEl){ e.preventDefault(); navigateTo(navEl.dataset.nav); return; }

  if(e.target.closest('#createBtn') || e.target.closest('#dashCreateBtn')){
    openModal(`<h3 style="font-size:19px; margin-bottom:16px;">Create something new</h3>
      <div style="display:flex; flex-direction:column; gap:10px;">
        <button class="btn btn-outline-dark" data-createchoice="project" style="justify-content:flex-start;">🎬 New Project</button>
        <button class="btn btn-outline-dark" data-createchoice="post" style="justify-content:flex-start;">📝 New Post</button>
        <button class="btn btn-outline-dark" data-createchoice="event" style="justify-content:flex-start;">📅 New Event</button>
        <button class="btn btn-outline-dark" data-createchoice="live" style="justify-content:flex-start;">🔴 Go Live</button>
      </div>`);
    return;
  }
  const createChoice = e.target.closest('[data-createchoice]');
  if(createChoice){
    closeModal();
    const c = createChoice.dataset.createchoice;
    if(c==="project"){ toast("New project created — opening Workspace…"); setTimeout(()=>navigateTo('workspace'),350); }
    else if(c==="event"){ openModal(createEventModal()); }
    else if(c==="live"){ toast("Starting your live stream…"); setTimeout(()=>navigateTo('live'),350); }
    else { toast("Post composer opened — share it in Community."); navigateTo('community'); }
    return;
  }

  if(e.target.closest('#notifBtn')){
    $('#notifDot').style.display='none';
    openModal(`<h3 style="font-size:18px; margin-bottom:14px;">Notifications</h3>
      <div style="display:flex; flex-direction:column; gap:12px; font-size:13.5px;">
        <div><strong>Maya Sharma</strong> commented on Summer Campaign <div style="color:var(--grey); font-size:11.5px;">12m ago</div></div>
        <div><strong>RightsGuard</strong> flagged an issue in Street Stories <div style="color:var(--grey); font-size:11.5px;">1h ago</div></div>
        <div><strong>Riya Kapoor</strong> approved Street Stories <div style="color:var(--grey); font-size:11.5px;">3h ago</div></div>
      </div>`);
    return;
  }

  if(e.target.closest('#hamburgerBtn')){ $('#mobileDrawer').classList.add('open'); return; }
  if(e.target.closest('#drawerScrim') || e.target.closest('#drawerClose')){ closeDrawer(); return; }
  if(e.target.closest('#modalCloseBtn') || e.target===$('#modalScrim')){ closeModal(); return; }

  const wfCard = e.target.closest('[data-workflow]');
  if(wfCard){
    const labels=["create","workspace","rightsguard","publish (workspace)","community"];
    toast(`Opening the "${["Create","Collaborate","Protect","Publish","Connect"][wfCard.dataset.workflow]}" stage…`);
    setTimeout(()=>navigateTo(["workspace","workspace","rightsguard","workspace","community"][wfCard.dataset.workflow]),300);
    return;
  }

  const projCard = e.target.closest('[data-project]');
  if(projCard){ openWorkspace(projCard.dataset.project); return; }
  const addAsset = e.target.closest('[data-addasset]');
  if(addAsset){ wsAddAssetToTimeline(addAsset.dataset.addasset); return; }

  // Full-screen Creative Workspace controls
  if(e.target.closest('#wsBackBtn') || e.target.closest('#wsCloseBtn')){ closeWorkspace(); if(STATE.present){ exitPresentMode(); } return; }
  const railBtn = e.target.closest('[data-wsrail]');
  if(railBtn){ wsSetPanel(railBtn.dataset.wsrail); return; }
  const wsVer = e.target.closest('[data-wsversion]');
  if(wsVer){ wsSelectVersion(wsVer.dataset.wsversion); toast(`Switched preview to ${wsVer.dataset.wsversion}`); return; }
  const wsJump = e.target.closest('[data-wsjump]');
  if(wsJump){ wsSeekTo(parseFloat(wsJump.dataset.wsjump)); toast(`Jumped to ${secToTimecode(parseFloat(wsJump.dataset.wsjump))}`); return; }
  if(e.target.closest('#wsPlayBtn')){ wsTogglePlay(); return; }
  if(e.target.closest('#wsSkipBack')){ wsSeekTo(wsCurrentTime - 10); return; }
  if(e.target.closest('#wsSkipFwd')){ wsSeekTo(wsCurrentTime + 10); return; }
  if(e.target.closest('#workPublishBtn') || e.target.closest('#workPublishBtn2')){ toast("Creator Documentary published to all connected platforms 🎉"); return; }
  if(e.target.closest('#workShareBtn')){ toast("Share link copied to clipboard."); return; }
  if(e.target.closest('#addCommentBtn')){
    const inp = $('#newCommentInput');
    if(inp && inp.value.trim()){ toast(`Comment added at ${secToTimecode(wsCurrentTime)}.`); inp.value=''; }
    return;
  }
  const taskCb = e.target.closest('[data-task]');
  if(taskCb){ toast(taskCb.checked? "Task marked complete." : "Task reopened."); return; }

  // Crew filters
  const cf = e.target.closest('[data-crewfilter]');
  if(cf){ STATE.crewFilter = cf.dataset.crewfilter; navigateTo('crew'); return; }
  const inviteBtn = e.target.closest('[data-invite]');
  if(inviteBtn){ toast(`Invite sent to ${inviteBtn.dataset.invite}.`); return; }

  // RightsGuard
  if(e.target.closest('#scanBtn')){ runRightsScan(); return; }
  const issueRow = e.target.closest('[data-rgissue]');
  if(issueRow){ openModal(rightsIssueModal(issueRow.dataset.rgissue)); return; }
  if(e.target.closest('#rgViewLicense')){ toast("Opening license details…"); return; }
  if(e.target.closest('#rgReplaceAsset')){ closeModal(); toast("Asset marked for replacement in Workspace."); return; }
  if(e.target.closest('#rgAttachLicense')){ closeModal(); toast("License attached. Issue resolved ✓"); return; }
  if(e.target.closest('#rgDismiss')){ closeModal(); toast("Issue dismissed."); return; }

  // Community
  const ctab = e.target.closest('[data-commtab]');
  if(ctab){ STATE.commTab = ctab.dataset.commtab; navigateTo('community'); return; }
  const joinComm = e.target.closest('[data-joincommunity]');
  if(joinComm){ joinComm.textContent="Joined ✓"; joinComm.classList.add('btn-primary'); toast(`Joined ${joinComm.dataset.joincommunity}.`); return; }
  if(e.target.closest('#createCommunityBtn')){ toast("Community created — invite your crew!"); return; }
  const likeBtn = e.target.closest('[data-like]');
  if(likeBtn){
    const span = likeBtn.querySelector('.likeCount');
    const liked = likeBtn.dataset.liked === "1";
    span.textContent = parseInt(span.textContent,10) + (liked? -1:1);
    likeBtn.dataset.liked = liked? "0":"1";
    likeBtn.style.color = liked? "":"var(--orange)";
    return;
  }
  if(e.target.closest('[data-share]')){ toast("Post link copied."); return; }

  // Live
  if(e.target.closest('#joinMembershipBtn')){ navigateTo('memberships'); return; }
  if(e.target.closest('#askQuestionBtn')){ toast("Your question was sent to the host."); return; }
  if(e.target.closest('#liveShareBtn')){ toast("Live stream link copied."); return; }
  if(e.target.closest('#liveChatSend')){
    const inp = $('#liveChatInput');
    if(inp && inp.value.trim()){ liveChatMsgs.push(inp.value.trim()); renderLiveChat(); inp.value=''; }
    return;
  }
  const pollOpt = e.target.closest('[data-poll]');
  if(pollOpt && !pollOpt.dataset.voted){
    $all('.pollOpt').forEach(b=>b.dataset.voted="1");
    const pct = [42,35,23];
    $all('.pollOpt').forEach((b,i)=>{ b.innerHTML = `${b.textContent} <strong style="float:right;">${pct[i]}%</strong>`; b.style.background = `linear-gradient(90deg, rgba(255,107,53,.18) ${pct[i]}%, transparent ${pct[i]}%)`; });
    toast("Vote submitted!");
    return;
  }

  // Events
  if(e.target.closest('#createEventBtn')){ openModal(createEventModal()); return; }
  const viewEvent = e.target.closest('[data-viewevent]');
  if(viewEvent){ openModal(eventModal(viewEvent.dataset.viewevent)); return; }
  const regEvent = e.target.closest('[data-registerevent]');
  if(regEvent){ closeModal(); regEvent.textContent="Registered ✓"; toast("You're registered for this event."); return; }
  if(e.target.closest('#ceSubmit')){
    const name = $('#ceName')?.value.trim();
    closeModal();
    toast(name? `Event "${name}" created.` : "Event created.");
    return;
  }

  // Profile
  const ptab = e.target.closest('[data-profiletab]');
  if(ptab){ profileTab = ptab.dataset.profiletab; navigateTo('profile'); return; }
  if(e.target.closest('#profileFollowBtn')){
    const b = e.target.closest('#profileFollowBtn');
    const following = b.dataset.f==="1";
    b.textContent = following? "Follow":"Following ✓";
    b.dataset.f = following? "0":"1";
    toast(following? "Unfollowed." : "You're now following Alex Mehta.");
    return;
  }

  // Memberships
  const plan = e.target.closest('[data-selectplan]');
  if(plan){ toast(`Managing your ${plan.dataset.selectplan} membership.`); return; }

  // Marketplace
  const mpt = e.target.closest('[data-mptab]');
  if(mpt){ STATE.mpTab = mpt.dataset.mptab; navigateTo('marketplace'); return; }
  const viewAsset = e.target.closest('[data-viewasset]');
  if(viewAsset){ toast(`Previewing "${viewAsset.dataset.viewasset}".`); return; }
  const licenseAsset = e.target.closest('[data-licenseasset]');
  if(licenseAsset){ toast(`"${licenseAsset.dataset.licenseasset}" licensed and added to your project.`); return; }

  // Presentation mode
  if(e.target.closest('#presentBtn')){ enterPresentMode(); return; }
  if(e.target.closest('#presentExit')){ exitPresentMode(); return; }
  if(e.target.closest('#presentNext')){ if(STATE.presentStep < PRESENT_STEPS.length-1){ STATE.presentStep++; applyPresentStep(); } else { toast("End of the CrewHub journey."); } return; }
  if(e.target.closest('#presentPrev')){ if(STATE.presentStep>0){ STATE.presentStep--; applyPresentStep(); } return; }
});

document.addEventListener('input', function(e){
  if(e.target.id==="crewSearch") refreshCrewGrid();
});

document.addEventListener('keydown', function(e){
  if(e.key==='Escape'){ closeModal(); closeDrawer(); }
});

/* initial boot */
navigateTo('landing');
setTimeout(()=>{ $('#notifDot').style.display='block'; }, 4000);
window.addEventListener('scroll', ()=>{ $('#topnav').classList.toggle('scrolled', window.scrollY > 8); }, {passive:true});
</script>
</body>
</html>
